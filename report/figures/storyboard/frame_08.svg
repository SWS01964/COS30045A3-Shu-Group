<text x="14" y="140" font-size="12.5" fill="#222" font-weight="700" text-anchor="start" >The road toll isn't the whole story.</text>
<text x="14" y="159" font-size="12.5" fill="#222" font-weight="700" text-anchor="start" >If you ride, you're part of a growing group.</text>
<text x="14" y="178" font-size="12.5" fill="#222" font-weight="700" text-anchor="start" >If your parents walk, it's what happens after.</text>
<text x="14" y="197" font-size="12.5" fill="#222" font-weight="700" text-anchor="start" >The roads are not equally safe for everyone.</text>
