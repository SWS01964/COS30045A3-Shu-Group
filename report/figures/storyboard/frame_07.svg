<text x="240.0" y="67" font-size="12" fill="#0a64d6" font-weight="600" text-anchor="middle" >3 Severity</text>
<rect x="293" y="48" width="92" height="28" rx="14" fill="#fff" stroke="#0a64d6" stroke-width="1.5" />
<text x="339.0" y="67" font-size="12" fill="#0a64d6" font-weight="600" text-anchor="middle" >4 Lockdown</text>
<rect x="392" y="48" width="78" height="28" rx="14" fill="#0a64d6" stroke="#0a64d6" stroke-width="1.5" />
<text x="431.0" y="67" font-size="12" fill="#fff" font-weight="600" text-anchor="middle" >5 Equity</text>
<rect x="477" y="48" width="71" height="28" rx="14" fill="#fff" stroke="#0a64d6" stroke-width="1.5" />
<text x="512.5" y="67" font-size="12" fill="#0a64d6" font-weight="600" text-anchor="middle" >Methods</text>
<text x="14" y="112" font-size="11" fill="#6b7280" font-weight="800" text-anchor="start" letter-spacing="2">CHAPTER 5</text>
<text x="14" y="140" font-size="21" fill="#222" font-weight="800" text-anchor="start" >In 2011 First Nations Australians</text>
<text x="14" y="165" font-size="21" fill="#222" font-weight="800" text-anchor="start" >were hospitalised at about the same</text>
<text x="14" y="190" font-size="21" fill="#222" font-weight="800" text-anchor="start" >rate. By 2021: half as high again.</text>
<text x="14" y="216" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start" font-family="Menlo,monospace">fig-5a</text>
<text x="386" y="216" font-size="10" fill="#6b7280" font-weight="400" text-anchor="end" font-family="Menlo,monospace">ch5_*.csv</text>
<rect x="14.0" y="226" width="186.0" height="38" rx="0" fill="#fff" stroke="#0a64d6" stroke-width="1.5" />
<text x="107.0" y="250" font-size="12" fill="#0a64d6" font-weight="700" text-anchor="middle" >Hospitalisations (2011=100)</text>
<rect x="200.0" y="226" width="186.0" height="38" rx="0" fill="#0a64d6" stroke="#0a64d6" stroke-width="1.5" />
<text x="293.0" y="250" font-size="12" fill="#fff" font-weight="700" text-anchor="middle" >Per 100,000 people</text>
<circle cx="300" cy="245" r="22" fill="#e8590c" fill-opacity="0.18" stroke="#e8590c" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="300" cy="245" r="9" fill="#e8590c"/>
