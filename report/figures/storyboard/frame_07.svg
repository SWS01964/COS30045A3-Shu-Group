<text x="34" y="821" font-size="12" fill="#fff" font-weight="800" text-anchor="start" letter-spacing="0.5">FRAME 7  |  Ch5 Index vs rate</text>
<text x="34" y="852" font-size="9" fill="#e8590c" font-weight="800" text-anchor="start" letter-spacing="1">USER ACTION</text>
<text x="150" y="852" font-size="12" fill="#222" font-weight="400" text-anchor="start" >Toggles Hospitalisations (index) to Per</text>
<text x="150" y="867" font-size="12" fill="#222" font-weight="400" text-anchor="start" >100,000 people on fig-5a.</text>
<text x="34" y="899" font-size="9" fill="#0a64d6" font-weight="800" text-anchor="start" letter-spacing="1">SYSTEM RESPONSE</text>
<text x="150" y="899" font-size="12" fill="#222" font-weight="400" text-anchor="start" >Two lines separate (145 to 226 vs 149 to</text>
<text x="150" y="914" font-size="12" fill="#222" font-weight="400" text-anchor="start" >149 per 100,000); a caveat box beside the</text>
<text x="150" y="929" font-size="12" fill="#222" font-weight="400" text-anchor="start" >chart notes possible recording changes.</text>
<text x="34" y="961" font-size="9" fill="#222" font-weight="800" text-anchor="start" letter-spacing="1">SAM LEARNS</text>
<text x="150" y="961" font-size="12" fill="#222" font-weight="400" text-anchor="start" >Counts hid a real gap: per person, First</text>
<text x="150" y="976" font-size="12" fill="#222" font-weight="400" text-anchor="start" >Nations Australians were hospitalised half</text>
<text x="150" y="991" font-size="12" fill="#222" font-weight="400" text-anchor="start" >as often again by 2021, with a caveat.</text>
