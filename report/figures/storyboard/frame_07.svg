<text x="274" y="217" font-size="11" fill="#e8590c" font-weight="800" text-anchor="start" >tap</text>
<rect x="14" y="278" width="372" height="230" rx="0" fill="#fff" stroke="#cfcdc7" stroke-width="1" />
<path d="M50,440 L120,435 L200,420 L280,360 L350,320" fill="none" stroke="#222" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="340" y="300" font-size="11" fill="#222" font-weight="800" text-anchor="end" >First Nations 226</text>
<path d="M50,442 L120,440 L200,441 L280,440 L350,441" fill="none" stroke="#55544f" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="356" y="462" font-size="11" fill="#55544f" font-weight="800" text-anchor="end" >Everyone else 149</text>
<text x="50" y="430" font-size="11" fill="#222" font-weight="800" text-anchor="start" >145</text>
<line x1="350" y1="324" x2="350" y2="438" stroke="#e8590c" stroke-width="2" />
<text x="332" y="386" font-size="11" fill="#e8590c" font-weight="800" text-anchor="end" >the gap</text>
<text x="24" y="498" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start" >2011</text>
<text x="376" y="498" font-size="10" fill="#6b7280" font-weight="400" text-anchor="end" >2021</text>
<rect x="14" y="522" width="372" height="76" rx="4" fill="#fff" stroke="#e8590c" stroke-width="2" />
<text x="26" y="544" font-size="10" fill="#e8590c" font-weight="800" text-anchor="start" letter-spacing="1.5">CAVEAT</text>
<text x="26" y="562" font-size="11.5" fill="#222" font-weight="400" text-anchor="start" >Better recording of Indigenous status may</text>
<text x="26" y="577" font-size="11.5" fill="#222" font-weight="400" text-anchor="start" >explain part of the rise. Counts alone hide</text>
<text x="26" y="592" font-size="11.5" fill="#222" font-weight="400" text-anchor="start" >the gap because the population grew.</text>
<text x="14" y="626" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" >Counts: 1,167 to 2,220 (+90%) vs 31,997 to 36,755 (+15%).</text>
<rect x="14" y="640" width="372" height="40" rx="4" fill="#fff" stroke="#cfcdc7" stroke-width="1" />
<text x="26" y="664" font-size="12" fill="#0a64d6" font-weight="700" text-anchor="start" >&gt; Show the numbers</text>
<rect x="40" y="700" width="320" height="32" rx="12" fill="#fff" stroke="#e8590c" stroke-width="2" />
<circle cx="60" cy="690" r="4" fill="#fff" stroke="#e8590c" stroke-width="2"/><circle cx="60.0" cy="695.0" r="6" fill="#fff" stroke="#e8590c" stroke-width="2"/>
<text x="200.0" y="722" font-size="13" fill="#e8590c" font-weight="700" text-anchor="middle" font-style="italic">"Counts hid this. Per person it is clear."</text>
