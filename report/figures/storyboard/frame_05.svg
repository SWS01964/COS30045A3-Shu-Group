<text x="34" y="821" font-size="12" fill="#fff" font-weight="800" text-anchor="start" letter-spacing="0.5">FRAME 5  |  Ch3 Measure stepper</text>
<text x="34" y="852" font-size="9" fill="#e8590c" font-weight="800" text-anchor="start" letter-spacing="1">USER ACTION</text>
<text x="150" y="852" font-size="12" fill="#222" font-weight="400" text-anchor="start" >Steps the measure: Admissions, then Bed</text>
<text x="150" y="867" font-size="12" fill="#222" font-weight="400" text-anchor="start" >days, then Deaths.</text>
<text x="34" y="899" font-size="9" fill="#0a64d6" font-weight="800" text-anchor="start" letter-spacing="1">SYSTEM RESPONSE</text>
<text x="150" y="899" font-size="12" fill="#222" font-weight="400" text-anchor="start" >Bars switch to the chosen measure: the</text>
<text x="150" y="914" font-size="12" fill="#222" font-weight="400" text-anchor="start" >pedestrian bar grows from 6.5% of</text>
<text x="150" y="929" font-size="12" fill="#222" font-weight="400" text-anchor="start" >admissions to 13.1% of bed days to 26.4%</text>
<text x="150" y="944" font-size="12" fill="#222" font-weight="400" text-anchor="start" >of deaths; the label sits on the bar.</text>
<text x="34" y="976" font-size="9" fill="#222" font-weight="800" text-anchor="start" letter-spacing="1">SAM LEARNS</text>
<text x="150" y="976" font-size="12" fill="#222" font-weight="400" text-anchor="start" >Pedestrians are few of the injured but</text>
<text x="150" y="991" font-size="12" fill="#222" font-weight="400" text-anchor="start" >many of those who die: the risk for Sam's</text>
<text x="150" y="1006" font-size="12" fill="#222" font-weight="400" text-anchor="start" >walking parents is outcome, not frequency.</text>
</svg>