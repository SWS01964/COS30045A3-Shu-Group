<rect x="110" y="437" width="105.0" height="13" rx="0" fill="#55544f" stroke="none" stroke-width="1" />
<text x="24" y="482" font-size="11" fill="#222" font-weight="700" text-anchor="start" >Cyclist</text>
<rect x="110" y="468" width="90.0" height="13" rx="0" fill="#bdbbb4" stroke="none" stroke-width="1" />
<rect x="110" y="483" width="33.0" height="13" rx="0" fill="#55544f" stroke="none" stroke-width="1" />
<text x="24" y="528" font-size="11" fill="#222" font-weight="700" text-anchor="start" >Car passenger</text>
<rect x="110" y="514" width="82.5" height="13" rx="0" fill="#bdbbb4" stroke="none" stroke-width="1" />
<rect x="110" y="529" width="67.5" height="13" rx="0" fill="#55544f" stroke="none" stroke-width="1" />
<text x="24" y="574" font-size="11" fill="#222" font-weight="700" text-anchor="start" >Pedestrian</text>
<rect x="110" y="560" width="39.0" height="13" rx="0" fill="#bdbbb4" stroke="none" stroke-width="1" />
<rect x="110" y="575" width="142.5" height="13" rx="0" fill="#e8590c" stroke="none" stroke-width="1" />
<text x="112" y="604" font-size="9" fill="#222" font-weight="400" text-anchor="start" ></text>
<rect x="110" y="600" width="10" height="8" rx="0" fill="#bdbbb4" stroke="none" stroke-width="1" />
<text x="124" y="607" font-size="9.5" fill="#55544f" font-weight="400" text-anchor="start" >share of admissions</text>
<rect x="240" y="600" width="10" height="8" rx="0" fill="#55544f" stroke="none" stroke-width="1" />
<text x="254" y="607" font-size="9.5" fill="#55544f" font-weight="400" text-anchor="start" >share of deaths in hospital</text>
<text x="250" y="558" font-size="10.5" fill="#e8590c" font-weight="800" text-anchor="start" >7.3% of admissions,</text>
<text x="250" y="571" font-size="10.5" fill="#e8590c" font-weight="800" text-anchor="start" >26.4% of deaths</text>
<text x="14" y="648" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" >Counts, not risk per trip: no data on how far people walk.</text>
<rect x="14" y="660" width="372" height="34" rx="4" fill="#fff" stroke="#cfcdc7" stroke-width="1" />
<text x="26" y="682" font-size="12" fill="#0a64d6" font-weight="700" text-anchor="start" >&gt; Show the numbers</text>
<rect x="40" y="704" width="320" height="32" rx="12" fill="#fff" stroke="#e8590c" stroke-width="2" />
