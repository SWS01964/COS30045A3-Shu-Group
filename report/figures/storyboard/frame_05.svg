<circle cx="330" cy="263" r="9" fill="#e8590c"/>
<path d="M334,267 L346,293 L352,287 L346,283 L358,279 L338,265 Z" fill="#fff" stroke="#e8590c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="304" y="235" font-size="11" fill="#e8590c" font-weight="800" text-anchor="start" >tap</text>
<text x="14" y="306" font-size="10.5" fill="#55544f" font-weight="600" text-anchor="start" >Pedestrian bar as Sam steps along:</text>
