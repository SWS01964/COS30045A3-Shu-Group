<text x="512.5" y="67" font-size="12" fill="#0a64d6" font-weight="600" text-anchor="middle" >Methods</text>
<text x="14" y="112" font-size="11" fill="#6b7280" font-weight="800" text-anchor="start" letter-spacing="2">CHAPTER 3</text>
<text x="14" y="140" font-size="21" fill="#222" font-weight="800" text-anchor="start" >Pedestrians are 1 in 14 of the</text>
<text x="14" y="165" font-size="21" fill="#222" font-weight="800" text-anchor="start" >injured, but 1 in 4 of those</text>
<text x="14" y="190" font-size="21" fill="#222" font-weight="800" text-anchor="start" >who die in hospital</text>
<text x="14" y="212" font-size="10" fill="#6b7280" font-weight="400" text-anchor="start" font-family="Menlo,monospace">fig-3a</text>
<text x="386" y="212" font-size="10" fill="#6b7280" font-weight="400" text-anchor="end" font-family="Menlo,monospace">severity.csv</text>
<text x="14" y="236" font-size="11" fill="#6b7280" font-weight="700" text-anchor="start" >Measure</text>
<rect x="14.0" y="244" width="124.0" height="38" rx="0" fill="#fff" stroke="#0a64d6" stroke-width="1.5" />
<text x="76.0" y="268" font-size="12" fill="#0a64d6" font-weight="700" text-anchor="middle" >Admissions</text>
