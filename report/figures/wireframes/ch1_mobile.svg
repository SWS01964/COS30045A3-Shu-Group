<text x="36.0" y="154.0" font-size="12" fill="#6b7280" font-weight="800" text-anchor="start" letter-spacing="2">CHAPTER 1</text>
<text x="36.0" y="195.0" font-size="25" fill="#222" font-weight="800" text-anchor="start">The road toll is</text>
<text x="36.0" y="224.5" font-size="25" fill="#222" font-weight="800" text-anchor="start">falling. The injury</text>
<text x="36.0" y="254.0" font-size="25" fill="#222" font-weight="800" text-anchor="start">toll isn't.</text>
<text x="36.0" y="288.5" font-size="16" fill="#55544f" font-weight="400" text-anchor="start">Deaths are down 11.5% since 2011,</text>
<text x="36.0" y="310.9" font-size="16" fill="#55544f" font-weight="400" text-anchor="start">admissions are up 16%, and per person</text>
<text x="36.0" y="333.3" font-size="16" fill="#55544f" font-weight="400" text-anchor="start">the rate has barely moved.</text>
<rect x="36.0" y="355.7" width="343.0" height="184.0" rx="0" fill="#e7e6e1" />
<rect x="36.0" y="355.7" width="4.0" height="184.0" rx="0" fill="#55544f" />
<text x="52.0" y="377.7" font-size="11" fill="#55544f" font-weight="800" text-anchor="start" letter-spacing="1.5">WHAT TO KNOW</text>
<circle cx="54.0" cy="396.8" r="2.5" fill="#55544f"/>
<text x="66.0" y="402.7" font-size="13" fill="#222" xml:space="preserve"><tspan font-weight="700">39,505</tspan> people were admitted to hospital</text>
<text x="66.0" y="420.7" font-size="13" fill="#222" xml:space="preserve">after road crashes in <tspan font-weight="700">2021,</tspan> about <tspan font-weight="700">108</tspan> a</text>
<text x="66.0" y="438.7" font-size="13" fill="#222" xml:space="preserve">day.</text>
<circle cx="54.0" cy="458.8" r="2.5" fill="#55544f"/>
<text x="66.0" y="464.7" font-size="13" fill="#222" xml:space="preserve">Road deaths are down <tspan font-weight="700">11.5%</tspan> and admissions</text>
<text x="66.0" y="482.7" font-size="13" fill="#222" xml:space="preserve">are up <tspan font-weight="700">16%</tspan> since <tspan font-weight="700">2011.</tspan></text>
<circle cx="54.0" cy="502.8" r="2.5" fill="#55544f"/>
<text x="66.0" y="508.7" font-size="13" fill="#222" xml:space="preserve">Per person, the hospitalisation rate barely</text>
<text x="66.0" y="526.7" font-size="13" fill="#222" xml:space="preserve">moved: about <tspan font-weight="700">152</tspan> to <tspan font-weight="700">154</tspan> per <tspan font-weight="700">100,000.</tspan></text>
