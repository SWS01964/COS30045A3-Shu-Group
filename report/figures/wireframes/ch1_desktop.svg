<text x="300.0" y="142.0" font-size="12" fill="#6b7280" font-weight="800" text-anchor="start" letter-spacing="2">CHAPTER 1</text>
<text x="300.0" y="192.0" font-size="34" fill="#222" font-weight="800" text-anchor="start">The road toll is falling. The</text>
<text x="300.0" y="232.1" font-size="34" fill="#222" font-weight="800" text-anchor="start">injury toll isn't.</text>
<text x="300.0" y="271.2" font-size="19" fill="#55544f" font-weight="400" text-anchor="start">Deaths are down 11.5% since 2011, admissions are up 16%, and per</text>
<text x="300.0" y="297.8" font-size="19" fill="#55544f" font-weight="400" text-anchor="start">person the rate has barely moved.</text>
<rect x="300.0" y="321.4" width="680.0" height="115.0" rx="0" fill="#e7e6e1" />
<rect x="300.0" y="321.4" width="4.0" height="115.0" rx="0" fill="#55544f" />
<text x="316.0" y="343.4" font-size="11" fill="#55544f" font-weight="800" text-anchor="start" letter-spacing="1.5">WHAT TO KNOW</text>
<circle cx="318.0" cy="363.1" r="2.5" fill="#55544f"/>
<text x="330.0" y="369.4" font-size="14" fill="#222" xml:space="preserve"><tspan font-weight="700">39,505</tspan> people were admitted to hospital after road crashes in <tspan font-weight="700">2021,</tspan> about <tspan font-weight="700">108</tspan> a day.</text>
<circle cx="318.0" cy="390.1" r="2.5" fill="#55544f"/>
<text x="330.0" y="396.4" font-size="14" fill="#222" xml:space="preserve">Road deaths are down <tspan font-weight="700">11.5%</tspan> and admissions are up <tspan font-weight="700">16%</tspan> since <tspan font-weight="700">2011.</tspan></text>
<circle cx="318.0" cy="417.1" r="2.5" fill="#55544f"/>
<text x="330.0" y="423.4" font-size="14" fill="#222" xml:space="preserve">Per person, the hospitalisation rate barely moved: about <tspan font-weight="700">152</tspan> to <tspan font-weight="700">154</tspan> per <tspan font-weight="700">100,000.</tspan></text>
