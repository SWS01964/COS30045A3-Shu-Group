<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" font-family="system-ui,-apple-system,sans-serif">
  <rect width="1600" height="1500" fill="#faf8f3"/>
  <text x="60" y="60" font-size="40" font-weight="700" fill="#1c2230">P3 — Wireframe detail: Chapter 1 and Chapter 2 figures</text>
  <text x="60" y="98" font-size="22" fill="#646b78">Where each control and chart region sits. Controls are drawn as pill toggles, a selector panel, and a sentence callout.</text>

  <!-- Figure 2 (lines) -->
  <g transform="translate(60,130)">
    <text x="0" y="0" font-size="24" font-weight="700" fill="#1c2230">Figure 2 — indexed lines</text>
    <rect x="0" y="16" width="700" height="16" fill="#d9d4c8"/>
    <rect x="0" y="48" width="220" height="36" rx="18" fill="#d9d4c8" stroke="#8796a8"/>
    <rect x="120" y="48" width="100" height="36" fill="#1c2230"/>
    <text x="65" y="71" text-anchor="middle" font-size="15" fill="#8796a8">Counts</text>
    <text x="170" y="71" text-anchor="middle" font-size="15" fill="#fff">Per person</text>
    <text x="240" y="71" font-size="14" fill="#646b78">  ← toggle (mode switch)</text>
    <rect x="0" y="100" width="700" height="240" fill="#ece8dc" stroke="#c8c2b4"/>
    <text x="350" y="225" text-anchor="middle" font-size="20" fill="#8796a8">line chart + grey NSW band + COVID marker</text>
    <text x="0" y="368" font-size="15" fill="#646b78">source note → data table (details)</text>
  </g>

  <!-- Figure 3 (heatmap) -->
  <g transform="translate(60,520)">
    <text x="0" y="0" font-size="24" font-weight="700" fill="#1c2230">Figure 3 — heatmap</text>
    <rect x="0" y="16" width="700" height="16" fill="#d9d4c8"/>
    <rect x="0" y="48" width="250" height="36" rx="18" fill="#d9d4c8" stroke="#8796a8"/>
    <text x="125" y="71" text-anchor="middle" font-size="15" fill="#434a5a">Change in number | per person</text>
    <rect x="0" y="100" width="700" height="56" rx="6" fill="#ffffff" stroke="#8796a8"/>
    <text x="18" y="122" font-size="15" font-weight="700" fill="#434a5a">Find yourself</text>
    <rect x="18" y="130" width="150" height="20" rx="4" fill="#ece8dc" stroke="#8796a8"/>
    <rect x="178" y="130" width="120" height="20" rx="4" fill="#ece8dc" stroke="#8796a8"/>
    <text x="320" y="133" font-size="14" fill="#646b78">← road-user + age selectors</text>
    <rect x="0" y="168" width="700" height="36" rx="6" fill="#f4d8c5" stroke="#b8470f"/>
    <text x="18" y="191" font-size="15" fill="#8f3406">sentence callout — plain-language reading of the selection</text>
    <rect x="0" y="216" width="700" height="240" fill="#ece8dc" stroke="#c8c2b4"/>
    <text x="350" y="340" text-anchor="middle" font-size="20" fill="#8796a8">heatmap grid (road user × age)</text>
    <rect x="0" y="468" width="300" height="24" fill="#d9d4c8" stroke="#8796a8"/>
    <text x="16" y="485" font-size="14" fill="#646b78">colour legend + hatch key</text>
    <rect x="0" y="504" width="700" height="130" fill="#ffffff" stroke="#c8c2b4"/>
    <text x="350" y="575" text-anchor="middle" font-size="18" fill="#8796a8">linked trend line (yearly, selected cell)</text>
  </g>

  <!-- Figure 4 (severity) -->
  <g transform="translate(840,130)">
    <text x="0" y="0" font-size="24" font-weight="700" fill="#1c2230">Figure 4 — severity</text>
    <rect x="0" y="16" width="700" height="16" fill="#d9d4c8"/>
    <rect x="0" y="48" width="700" height="360" fill="#ece8dc" stroke="#c8c2b4"/>
    <text x="350" y="120" text-anchor="middle" font-size="19" fill="#8796a8">panel 1 — hospitalised people</text>
    <text x="350" y="230" text-anchor="middle" font-size="19" fill="#8796a8">panel 2 — average days in hospital</text>
    <text x="350" y="340" text-anchor="middle" font-size="19" fill="#8796a8">panel 3 — died in hospital per 1,000</text>
    <text x="0" y="440" font-size="15" fill="#646b78">shared age axis down the left; 75+ row highlighted</text>
  </g>
</svg>
